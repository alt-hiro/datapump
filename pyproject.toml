[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "datapump"
version = "0.1.0"
description = "Extract dbt compiled SQL to CSV and upload to object storage."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
  "PyYAML>=6.0",
  "boto3>=1.28",
  "azure-storage-blob>=12.19",
  "psycopg2-binary>=2.9",
  "pyodbc>=4.0",
]

[project.scripts]
datapump = "datapump.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["datapump*"]
